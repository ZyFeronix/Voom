version: 2

updates:
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      svelte:
        patterns:
          - "svelte"
          - "@sveltejs/*"
      vite:
        patterns:
          - "vite"
          - "@sveltejs/vite-plugin-svelte"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(deps)"
