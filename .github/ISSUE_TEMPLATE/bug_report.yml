name: Reporte de error
description: Algo no funciona como debería en Voom!
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. Revisa antes [`DOCS.md`](../blob/main/DOCS.md) y busca issues duplicados.

  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options:
        - Instancia propia (Docker)
        - Instancia propia (Node directo)
        - Desarrollo local
        - Otro / no estoy seguro
    validations:
      required: true

  - type: textarea
    id: que-ocurre
    attributes:
      label: Qué ocurre
      description: Comportamiento observado frente al esperado.
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Iniciar sesión como ...
        2. Ir a /...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: "0.6.0-beta.2"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs del servidor o de la consola
      description: |
        Elimina tokens, correos y cualquier dato personal antes de pegar.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirmaciones
    attributes:
      label: Confirmaciones
      options:
        - label: He buscado issues duplicados
          required: true
        - label: He eliminado datos personales y secretos de los logs
          required: true
