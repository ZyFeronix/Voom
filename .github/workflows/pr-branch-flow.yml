# WHEN:   A pull request targets dev, beta or main.
# WHAT:   Blocks PRs that skip the promotion path (work branch -> dev -> beta -> main).
# WRITES: Nothing (read-only).
#
name: PR - Branch flow

on:
  pull_request:
    branches: [main, beta, dev]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: branch-flow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-flow:
    uses: ZyFeronix/utils/.github/workflows/branch-flow.yml@main
