name: Branch flow

# Enforces the promotion path: work branches -> dev -> beta -> main.
# Runs on a 1-vCPU slim runner and takes a few seconds per event.

on:
  pull_request:
    branches: [main, beta, dev]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: branch-flow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Promotion path
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Check source and target branches
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "PR: $HEAD -> $BASE"
          case "$BASE" in
            dev)
              case "$HEAD" in
                main|beta)
                  echo "::error::main and beta cannot open PRs into dev. Open a work branch against dev instead."
                  exit 1
                  ;;
              esac
              ;;
            beta)
              if [ "$HEAD" != "dev" ]; then
                echo "::error::Only dev can be promoted to beta. Received source: $HEAD."
                exit 1
              fi
              ;;
            main)
              if [ "$HEAD" != "beta" ]; then
                echo "::error::Only beta can be promoted to main. Received source: $HEAD."
                exit 1
              fi
              ;;
            *)
              echo "Base branch has no rules: $BASE"
              ;;
          esac
          echo "Valid path: $HEAD -> $BASE"
