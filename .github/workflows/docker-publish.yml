name: Docker Publish

# Publica ghcr.io/zyferonix/voom:
#   - push a `beta`  → :beta (se sobrescribe siempre)
#   - push a `main`  → crea el tag git vX.Y.Z (X.Y.Z = frontend/package.json),
#                      publica :X.Y.Z y sobrescribe :latest.
#                      Falla si vX.Y.Z ya existe: sube la versión antes de promover.
#   - a demanda      → :manual
# Multi-arch (amd64 + arm64 para Oracle Ampere/Raspberry). Para no agotar la
# cuota del registro: el build JS se comparte entre arquitecturas, sin
# attestations (provenance/SBOM crean manifiestos extra). No se podan versiones
# "sin etiqueta": en una imagen multi-arch los manifiestos por arquitectura
# también lo están y borrarlos rompería la imagen.

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  # En main nunca cancelar: cortar a medias dejaría :latest publicado sin tag git.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # crear el tag git de versión en main
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Versión (solo main)
        id: ver
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION="$(node -p "require('./frontend/package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::El tag v${VERSION} ya existe. Sube la versión en frontend/package.json antes de promover a main."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige el nombre en minúsculas (el owner es ZyFeronix).
      - name: Nombre de imagen en minúsculas
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Metadatos (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version || 'none' }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tag git solo cuando la imagen ya se publicó con éxito.
      - name: Crear tag git
        if: github.ref == 'refs/heads/main'
        run: |
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"
