# WHEN:   A push to beta or main (after a merge), or manually.
# WHAT:   Smoke-tests the image on amd64 + arm64, then publishes it to GHCR. main -> :latest + :X.Y.Z + git tag; beta -> :beta; manual -> :manual. Fails early if the tag already exists, so bump the version first.
# WRITES: GHCR image tags and the git tag vX.Y.Z on main.
#
name: Release - Docker image

# Smoke-tests the image, then publishes ghcr.io/zyferonix/voom (details in the shared workflow):
#   push to `beta` -> :beta
#   push to `main` -> :latest + :X.Y.Z (from frontend/package.json) + git tag vX.Y.Z;
#                     fails early if that tag already exists, so bump the version before promoting.
#   on demand      -> :manual

on:
  push:
    branches: [main, beta]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  # Never cancel on main: stopping halfway could leave :latest published without its git tag.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
      packages: write
    uses: ZyFeronix/utils/.github/workflows/docker-publish.yml@main
    with:
      release-version: true
