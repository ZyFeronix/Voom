# WHEN:   A push to main or beta (after a merge), or manually.
# WHAT:   Mirrors main, beta and tags to GitLab.
# WRITES: The GitLab mirror only.
#
name: Release - Sync to GitLab

on:
  push:
    branches: [main, beta]
    # The mirror replicates the whole repository; skip it when only Actions config changed.
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running mirror; queued runs collapse to the latest.
concurrency:
  group: sync-gitlab
  cancel-in-progress: false

jobs:
  sync:
    uses: ZyFeronix/utils/.github/workflows/sync-gitlab.yml@main
    with:
      gitlab-repo: voom
    secrets:
      GITLAB_ACCESS_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
