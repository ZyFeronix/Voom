name: Sync to GitLab

on:
  push:
    branches:
      - main
    # El mirror replica el repositorio completo; este filtro solo evita
    # re-mirrorar cuando lo único que cambia es la configuración de Actions.
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-slim
    timeout-minutes: 15

    env:
      TARGET_REPO_URL: "git.alexdevuwu.com/organizations/zyferonix/voom.git"
      GITLAB_USER: "oauth2"

    steps:
      - name: Mirror to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --mirror "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          # Solo ramas y etiquetas: los refs/pull/* de GitHub no existen en GitLab
          # y hacen que el push falle con "deny updating a hidden ref".
          git push --prune "https://${GITLAB_USER}:${GITLAB_TOKEN}@${TARGET_REPO_URL}" \
            "+refs/heads/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"
