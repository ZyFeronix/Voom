name: Sync to GitLab

on:
  push:
    branches:
      - main
    # El mirror replica el repo completo (clone --mirror + push --mirror);
    # este filtro solo evita re-mirrorar cuando el único cambio es
    # configuración de GitHub Actions (.github/), que no es contenido del proyecto.
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      TARGET_REPO_URL: "git.alexdevuwu.com/organizations/zyferonix/vsocial.git"
      GITLAB_USER: "oauth2"

    steps:
      - name: Mirror to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --mirror "https://oauth2:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          git push --mirror "https://${GITLAB_USER}:${GITLAB_TOKEN}@${TARGET_REPO_URL}"
