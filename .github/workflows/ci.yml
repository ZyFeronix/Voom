# Voom! — Continuous Integration
#
# Runs the same gates the Husky pre-commit hook enforces locally
# (prettier --check + eslint + production build) on every pull request,
# so a broken change can't reach main unnoticed. Every branch in the
# dev -> beta -> main flow is covered.
#
# Tests are intentionally omitted for now: `npm run test` (vitest) is currently
# broken in this repo — vitest fails to create the Vite server and better-sqlite3
# (the DB driver the test assumes) isn't installed. Once the test environment is
# fixed, re-enable the `test` job below.
name: CI

# PR-only (plus manual runs): pushes to main/beta are merges of PRs that were
# already checked, so re-running there would only burn Actions minutes.
on:
  pull_request:
    branches: [main, beta, dev]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

# Cancel superseded runs on the same ref — saves CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (prettier --check + eslint)
        run: npm run lint

      # The build output is not uploaded as an artifact: nobody downloads it and it
      # would eat into the Free-plan storage quota (~14 MB per run).
      - name: Build (Vite production build + SvelteKit adapter-node)
        run: npm run build

  # --- Tests (disabled until the test environment is fixed) -----------------
  # Uncomment once `npm run test` passes locally. The blocker today:
  #   1. vitest fails at Vite-server creation (vite-plugin-svelte hot-update).
  #   2. tests/auth.test.js uses the better-sqlite3 sync API but only @libsql/client
  #      is installed (async). Either install better-sqlite3 as a devDep or
  #      migrate the test to `await db.prepare(...).get()`.
