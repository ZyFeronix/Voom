# WHEN:   A pull request targets dev, beta or main (docs-only changes are skipped), or manually.
# WHAT:   Lint & Build (required check on main) + Docker image smoke test and compose validation when packaging files change.
# WRITES: Nothing (read-only). Publishing happens AFTER the merge, in release-docker-image.yml.
#
# Voom! — Continuous Integration
#
# Same gates as the Husky pre-commit hook (prettier --check + eslint + production build) on every
# PR of the dev -> beta -> main flow, plus the Docker image smoke test when packaging changes.
#
# Tests are intentionally omitted: `npm run test` (vitest) is currently broken — vitest fails to
# create the Vite server and tests/auth.test.js uses the better-sqlite3 sync API while only
# @libsql/client (async) is installed. Add a `test` job here once that is fixed.
name: PR - Checks

on:
  pull_request:
    branches: [main, beta, dev]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build # required status check on main: keep the name
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  docker:
    uses: ZyFeronix/utils/.github/workflows/docker-smoke.yml@main
    with:
      packaging-paths: '^(Dockerfile|\.dockerignore|docker-entrypoint\.sh|docker-compose\.yml|install\.sh|scripts/|schema_sqlite\.sql|migrations/|frontend/(package(-lock)?\.json|server.*\.js|src/lib/server/)|\.github/workflows/(pr-checks|release-docker-image)\.yml)'
      compose-profiles: default backup
