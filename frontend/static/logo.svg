<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D17" />
      <stop offset="50%" stop-color="#081B2E" />
      <stop offset="100%" stop-color="#0B3C5D" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 212, 170, 0.35)" />
      <stop offset="100%" stop-color="rgba(2, 20, 37, 0.85)" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFC8" />
      <stop offset="50%" stop-color="#1B85F3" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#00FFC8" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="32" flood-color="#1B85F3" flood-opacity="0.35"/>
    </filter>
    <filter id="glassHighlight" x="0" y="0" width="100%" height="100%">
      <feSurfaceErosion in="SourceGraphic" result="eroded20" in2="SourceGraphic" operator="erode" radius="20"/>
      <feConvolveMatrix in="eroded20" result="hilite" kernelMatrix="1 1 1 -2 4 -2 1 1 1" divisor="4" order="3 3"/>
    </filter>
    <mask id="noiseMask">
      <filter id="noise" x="0" y="0" width="100%" height="100%">
        <feTurbulence baseFrequency="0.9" numOctaves="3" type="fractalNoise" seed="2"/>
        <feColorMatrix type="saturate" values="0"/>
        <feComponentTransfer>
          <feFuncA type="linear" slope="0.03"/>
        </feComponentTransfer>
      </filter>
      <rect x="0" y="0" width="512" height="512" fill="url(#noise)" />
    </mask>
  </defs>

  <!-- Background: Abyssal Cyberspace -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  <rect width="512" height="512" rx="120" fill="url(#glass)" />

  <!-- Glass border with specular highlight -->
  <rect x="5" y="5" width="502" height="502" rx="115" fill="none" stroke="rgba(0, 212, 170, 0.3)" stroke-width="8" />
  <rect x="5" y="5" width="502" height="502" rx="115" fill="url(#glassHighlight)" />
  <rect x="5" y="5" width="502" height="502" rx="115" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" />

  <!-- Anti-plastic noise texture -->
  <rect x="5" y="5" width="502" height="502" rx="115" fill="url(#noise)" mask="url(#noiseMask)" opacity="0.12" />

  <!-- "VOOM!" lettering -->
  <text x="256" y="340"
        font-family="Outfit, -apple-system, BlinkMacSystemFont, sans-serif"
        font-weight="700"
        font-size="200"
        fill="url(#neonGlow)"
        text-anchor="middle"
        letter-spacing="-8"
        filter="url(#glow)">
    VOOM!
  </text>

  <!-- Subtle binary rain accent (top-right quadrant) -->
  <g opacity="0.15" font-family="JetBrains Mono, monospace" font-size="11" fill="#00FFC8">
    <text x="370" y="60">101010</text>
    <text x="400" y="78">010001</text>
    <text x="380" y="96">110010</text>
    <text x="410" y="114">001101</text>
    <text x="375" y="132">101100</text>
    <text x="405" y="150">011001</text>
    <text x="360" y="168">110101</text>
  </g>

  <!-- Binary rain accent (left side) -->
  <g opacity="0.12" font-family="JetBrains Mono, monospace" font-size="11" fill="#1B85F3">
    <text x="100" y="460">010111</text>
    <text x="120" y="478">110010</text>
    <text x="140" y="496">101001</text>
  </g>
</svg>