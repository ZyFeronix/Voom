<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D17" />
      <stop offset="100%" stop-color="#081B2E" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFC8" />
      <stop offset="100%" stop-color="#1B85F3" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00FFC8" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#1B85F3" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(0, 212, 170, 0.3)" stroke-width="2" />
  <text x="32" y="44"
        font-family="Outfit, -apple-system, BlinkMacSystemFont, sans-serif"
        font-weight="700"
        font-size="30"
        fill="url(#neonGlow)"
        text-anchor="middle"
        letter-spacing="-1"
        filter="url(#glow)">
    VOOM!
  </text>
</svg>