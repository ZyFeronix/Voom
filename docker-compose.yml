# =============================================================================
# Voom! — Stack de producción (Docker / Portainer). UN SOLO ARCHIVO.
#
#   Mínimo:   DOMAIN=voom.example.com docker compose up -d
#   Guía:     DEPLOY.md   ·   Instalador 1-comando: install.sh
#
# Variables (en .env junto a este archivo, o en la UI de Portainer):
#   DOMAIN      (obligatoria) dominio con DNS A → IP del servidor
#   VOOM_TAG    (opcional) versión de la imagen: latest | beta | 1.2.3
#   JWT_SECRET  (opcional) si falta se genera y persiste en el volumen
#
# Caddy emite el certificado TLS (Let's Encrypt) solo y su Caddyfile va
# embebido abajo: no hay que copiar ni montar ningún otro archivo.
# =============================================================================

name: voom

services:
  voom:
    image: ghcr.io/zyferonix/voom:${VOOM_TAG:-latest}
    init: true
    restart: unless-stopped
    environment:
      ORIGIN: https://${DOMAIN:?Define DOMAIN (ej. voom.example.com)}
      TRUST_PROXY: '1'
      BODY_SIZE_LIMIT: '52428800' # máx. subida: 50 MB
      DB_PATH: /data/database.sqlite
      UPLOAD_DIR: /data/uploads
      MIGRATIONS_DIR: /app/migrations
      JWT_SECRET: ${JWT_SECRET:-}
      # Turso remoto en vez de SQLite local (opcional):
      # DATABASE_URL: libsql://tu-db.turso.io
      # DATABASE_AUTH_TOKEN: tu-token
    volumes:
      - voom_data:/data
    # Sin puertos publicados: solo Caddy lo alcanza por la red interna.
    expose: ['3000']
    security_opt: ['no-new-privileges:true']
    logging: &logging
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      voom: { condition: service_healthy }
    ports:
      - '80:80' # validación ACME + redirección a HTTPS
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy_data:/data # certificados: NO borrar (límites de Let's Encrypt)
      - caddy_config:/config
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        printf '{$$DOMAIN} {\n\tencode zstd gzip\n\treverse_proxy voom:3000\n}\n' > /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    security_opt: ['no-new-privileges:true']
    logging: *logging

  # ── Backups diarios (opcional): docker compose --profile backup up -d ─────
  # Reutiliza la imagen de Voom (nada extra que descargar). 03:30 cada día,
  # conserva 7 en /data/backups (ver DEPLOY.md para copiarlos fuera).
  backup:
    image: ghcr.io/zyferonix/voom:${VOOM_TAG:-latest}
    profiles: ['backup']
    init: true
    restart: unless-stopped
    depends_on: [voom]
    environment:
      DATA_DIR: /data
    volumes:
      - voom_data:/data
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          if [ "$$(date +%H:%M)" = "03:30" ]; then
            sh /app/scripts/backup.sh /data || true
            sleep 60
          fi
          sleep 30
        done
    logging: *logging

volumes:
  voom_data:
  caddy_data:
  caddy_config:
